<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: "Comic Sans MS", cursive;
      background-color: #ffffff; /* Fundo da página branco */
      display: flex;
      justify-content: center;
    }

    /* 🔥 ESTE É O MENU DE ESCOLHA COM FUNDO AZUL */
    .menu-selecao {
      background-color: #87CEFA; /* Azul Celeste */
      border-radius: 30px;
      padding: 40px;
      width: 100%;
      max-width: 1000px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    h2 {
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }

    .grade {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    /* 🔥 CARD TOTALMENTE QUADRADO */
    .card-animal {
      background-color: white;
      aspect-ratio: 1 / 1; 
      border-radius: 15px; /* Bordas levemente curvas */
      overflow: hidden;
      cursor: pointer;
      border: 5px solid white;
      transition: transform 0.3s;
      display: flex;
    }

    .card-animal:hover {
      transform: scale(1.05);
      border-color: #FFD700;
    }

    .card-animal img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Garante que preencha o quadrado */
      border-radius: 0 !important; /* Força a não ser círculo */
    }
  </style>
</head>
<body>

  <div class="menu-selecao">
    <h2>Escolha uma imagem para colorir:</h2>
    <div class="grade" id="gameGrid"></div>
  </div>

  <script>
    const jogos = [
      { nome: "Animal 1", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 2", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 3", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 4", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 5", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 6", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 7", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 8", url: "https://github.io", img: "https://postimg.cc" }
    ];

    const gameGrid = document.getElementById('gameGrid');
    jogos.forEach(jogo => {
      const card = document.createElement('div');
      card.className = 'card-animal';
      card.innerHTML = `<img src="${jogo.img}" alt="${jogo.nome}">`;
      card.onclick = () => window.top.location.href = jogo.url;
      gameGrid.appendChild(card);
    });
  </script>
</body>
</html>
