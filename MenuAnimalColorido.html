<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo de Colorir</title>

  <style>
    /* Estilos Gerais */
    body {
      margin: 0;
      padding: 0;
      font-family: "Comic Sans MS", cursive;
      background-color: #87CEFA; /* Fundo azul da página */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 🔥 CONTAINER DO MENU (COM COR DE FUNDO) */
    .caixa-selecao {
      background-color: #f0faff; /* Azul bem clarinho */
      border: 5px solid #ffffff;
      border-radius: 30px;
      padding: 40px;
      width: 90%;
      max-width: 1100px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }

    h2 {
      color: #333;
      margin-bottom: 30px;
      font-size: 2em;
    }

    /* GRID DOS JOGOS */
    .grade-jogos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 25px;
    }

    /* 🔥 CARD QUADRADO (NOVO NOME PARA EVITAR CACHE) */
    .card-quadrado {
      background-color: white;
      width: 100%;
      aspect-ratio: 1 / 1; /* Garante que seja sempre um quadrado perfeito */
      border-radius: 20px; /* Bordas amigáveis */
      overflow: hidden;
      cursor: pointer;
      border: 6px solid #fff;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-quadrado:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 12px 25px rgba(0,0,0,0.2);
      border-color: #FFD700; /* Borda amarela no hover */
    }

    .card-quadrado img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Faz a imagem preencher o quadrado sem distorcer */
      display: block;
    }

  </style>
</head>
<body>

  <!-- Menu de Escolha -->
  <div class="caixa-selecao">
    <h2>Escolha uma imagem para colorir:</h2>
    
    <div class="grade-jogos" id="gameGrid">
      <!-- Os jogos entram aqui via JavaScript -->
    </div>
  </div>

  <script>
    // Substitua as URLs abaixo pelas suas imagens reais
    const jogos = [
      { nome: "Animal 1", url: "URL_DO_JOGO_1", img: "https://postimg.cc" },
      { nome: "Animal 2", url: "URL_DO_JOGO_2", img: "https://postimg.cc" },
      { nome: "Animal 3", url: "URL_DO_JOGO_3", img: "https://postimg.cc" },
      { nome: "Animal 4", url: "URL_DO_JOGO_4", img: "https://postimg.cc" },
      { nome: "Animal 5", url: "URL_DO_JOGO_5", img: "https://postimg.cc" },
      { nome: "Animal 6", url: "URL_DO_JOGO_6", img: "https://postimg.cc" },
      { nome: "Animal 7", url: "URL_DO_JOGO_7", img: "https://postimg.cc" },
      { nome: "Animal 8", url: "URL_DO_JOGO_8", img: "https://postimg.cc" }
    ];

    const gameGrid = document.getElementById('gameGrid');

    jogos.forEach(jogo => {
      const card = document.createElement('div');
      card.className = 'card-quadrado';
      card.innerHTML = `<img src="${jogo.img}" alt="${jogo.nome}">`;
      card.onclick = () => {
        window.top.location.href = jogo.url;
      };
      gameGrid.appendChild(card);
    });
  </script>

</body>
</html>
