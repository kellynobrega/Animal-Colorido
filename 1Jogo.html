<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo de Colorir</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Comic Sans MS", cursive;
      overflow: hidden;
    }

    body.fundo-azul {
      background-color: #87CEFA;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://i.postimg.cc/BnkNfpJ5/capa-6.jpg') no-repeat center center fixed;
      background-size: cover;
      z-index: -1;
    }

    .tela, .menu, .jogo {
      display: none;
    }

    .ativa {
      display: block;
    }

    .container {
      position: relative;
      text-align: center;
      height: 100vh;
      color: black;
    }

    #startGameBtn {
      position: absolute;
      left: 50%;
      top: 80%;
      transform: translateX(-50%);
      padding: 15px 40px;
      font-size: 1.5em;
      border: none;
      border-radius: 30px;
      background-color: #FFD700;
      color: #000;
      cursor: pointer;
      animation: pulse 1.5s infinite;
      z-index: 10;
    }

    #startGameBtn:hover {
      transform: translateX(-50%) scale(1.1);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
    }

    #menuOpcoes {
      position: relative;
      left: 50%;
      top: 80%;
      transform: translateX(-50%);
      z-index: 10;
      display: none;
    }

    #menuOpcoes button {
      padding: 15px 40px;
      margin: 10px 5px;
      font-size: 1.5em;
      border: none;
      border-radius: 30px;
      background-color: #add8e6;
      color: #333;
      cursor: pointer;
      transition: background-color 0.3s ease;
      min-width: 150px;
    }

    /* 🔥 GRID CENTRALIZADA 4x4 QUE PREENCHE A TELA */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      gap: 30px;
      width: 100vw;
      min-height: 100vh;
      margin: 0;
      background-color: #FFD1DC; 
      padding: 50px;
      justify-items: center;
      align-content: center; 
    }

    /* 🔥 ESTILO DO TÍTULO DENTRO DA ÁREA ROSA */
    .titulo-menu {
      grid-column: span 4;
      font-size: 2.2em;
      color: #333;
      margin-bottom: 20px;
    }

    /* 🔥 QUADRADOS MAIORES */
    .thumbnail {
      width: 220px !important; 
      height: 220px !important;
      background-color: white !important;
      border-radius: 20px !important;
      overflow: hidden !important;
      border: 6px solid white !important;
      box-shadow: 0 8px 15px rgba(0,0,0,0.15) !important;
      cursor: pointer !important;
      transition: transform 0.3s ease !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .thumbnail:hover {
      transform: scale(1.08) !important;
    }

    .thumbnail img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 0 !important;
    }

    /* 🔥 ÁREA DO JOGO PREENCHENDO TUDO */
    .jogo.ativa {
      display: block !important;
      width: 100vw;
      height: 100vh;
      background-color: #FFD1DC; 
      margin: 0;
      padding: 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Botão Voltar */
    #btnVoltar {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1000;
      padding: 10px 20px;
      font-size: 1.3em;
      border-radius: 30px;
      border: none;
      background-color: #FFD700;
      cursor: pointer;
      display: none; 
    }

    #modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }

    #modalContent {
      background-color: white;
      padding: 20px 30px;
      border-radius: 10px;
      max-width: 400px;
      color: black;
      text-align: left;
    }
  </style>
</head>
<body class="fundo-azul">

  <div class="background" id="backgroundGif"></div>

  <button id="btnVoltar">🔙 Voltar</button>

  <div id="telaInicial" class="tela ativa container">
    <button id="startGameBtn">🎮 Start Game</button>
  </div>

  <div id="menuOpcoes" class="container">
    <button id="jogarBtn">▶ Jogar</button>
    <button id="instrucoesBtn">ℹ Instruções</button>
  </div>

  <div id="menuLetras" class="menu container">
    <div class="grid" id="gridLetras">
       <!-- O Título agora é gerado aqui dentro para ficar no rosa -->
       <h2 class="titulo-menu">Escolha um desenho para colorir:</h2>
    </div>
  </div>

  <div id="areaJogo" class="jogo container">
    <iframe id="iframeJogo" src=""></iframe>
  </div>

  <div id="modal">
    <div id="modalContent">
      <h2>Instruções do Jogo</h2>
      <ol>
        <li>Clique em Jogar.</li>
        <li>Escolha uma imagem.</li>
        <li>Pinte com o mouse!</li>
      </ol>
      <button onclick="document.getElementById('modal').style.display='none'">Fechar</button>
    </div>
  </div>

  <script>
    const telaInicial = document.getElementById("telaInicial");
    const menuOpcoes = document.getElementById("menuOpcoes");
    const menuLetras = document.getElementById("menuLetras");
    const areaJogo = document.getElementById("areaJogo");
    const btnVoltar = document.getElementById("btnVoltar");
    const iframeJogo = document.getElementById("iframeJogo");

    const letras = [
      { nome: "Animal 1", url: "https://kellynobrega.github.io/Animal-Colorido/animal1.html", img: "https://i.postimg.cc/DwDyNnFb/1.png" },
      { nome: "Animal 2", url: "https://kellynobrega.github.io/Animal-Colorido/animal2.html", img: "https://i.postimg.cc/9FgW4C4H/2.png" },
      { nome: "Animal 3", url: "https://kellynobrega.github.io/Animal-Colorido/animal3.html", img: "https://i.postimg.cc/MTwxkGLP/3.png" },
      { nome: "Animal 4", url: "https://kellynobrega.github.io/Animal-Colorido/animal4.html", img: "https://i.postimg.cc/MZdw4qmb/4.png" },
      { nome: "Animal 5", url: "https://kellynobrega.github.io/Animal-Colorido/animal5.html", img: "https://i.postimg.cc/VkbcdMQV/5.png" },
      { nome: "Animal 6", url: "https://kellynobrega.github.io/Animal-Colorido/animal6.html", img: "https://i.postimg.cc/50ghZSLf/6.png" },
      { nome: "Animal 7", url: "https://kellynobrega.github.io/Animal-Colorido/animal7.html", img: "https://i.postimg.cc/HWZGz3T8/7.png" },
      { nome: "Animal 8", url: "https://kellynobrega.github.io/Animal-Colorido/animal8.html", img: "https://i.postimg.cc/Pr9gsxp1/8.jpg" }
    ];

    const gridLetras = document.getElementById("gridLetras");
    letras.forEach(letra => {
      const div = document.createElement("div");
      div.className = "thumbnail";
      div.innerHTML = `<img src="${letra.img}" alt="${letra.nome}">`;
      div.onclick = () => {
        menuLetras.classList.remove("ativa");
        areaJogo.classList.add("ativa");
        iframeJogo.src = letra.url;
      };
      gridLetras.appendChild(div);
    });

    document.getElementById("startGameBtn").onclick = () => {
      telaInicial.classList.remove("ativa");
      menuOpcoes.style.display = "block";
    };

    document.getElementById("jogarBtn").onclick = () => {
      menuOpcoes.style.display = "none";
      menuLetras.classList.add("ativa");
      btnVoltar.style.display = "block";
    };

    document.getElementById("instrucoesBtn").onclick = () => {
      document.getElementById("modal").style.display = "flex";
    };

    btnVoltar.onclick = () => {
      if (areaJogo.classList.contains("ativa")) {
        areaJogo.classList.remove("ativa");
        menuLetras.classList.add("ativa");
        iframeJogo.src = "";
      } else if (menuLetras.classList.contains("ativa")) {
        menuLetras.classList.remove("ativa");
        menuOpcoes.style.display = "block";
        btnVoltar.style.display = "none";
      }
    };
  </script>
</body>
</html>
