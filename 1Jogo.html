<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo de Colorir</title>

  <style>
    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Comic Sans MS", cursive;
      overflow-x: hidden;
    }

    body.fundo-azul {
      background-color: #ffffff; /* Fundo da página branco para destacar o menu */
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://postimg.cc') no-repeat center center fixed;
      background-size: cover;
      z-index: -1;
    }

    .container {
      position: relative;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 🔥 PAINEL DO MENU COM FUNDO AZUL */
    .menu-container {
      background-color: #87CEFA; /* Azul Celeste */
      border-radius: 30px;
      padding: 40px 20px;
      width: 95%;
      max-width: 1000px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      margin-top: 50px;
    }

    h2 {
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      font-size: 2em;
      margin-bottom: 30px;
    }

    /* 🔥 GRID DAS MINIATURAS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 25px;
      justify-items: center;
    }

    /* 🔥 MINIATURA QUADRADA */
    .thumbnail {
      width: 160px !important;
      height: 160px !important;
      background-color: white !important;
      border-radius: 18px !important; /* Estilo quadrado moderno */
      overflow: hidden !important;
      border: 5px solid white !important;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15) !important;
      cursor: pointer !important;
      transition: transform 0.3s ease !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .thumbnail:hover {
      transform: scale(1.08) !important;
      border-color: #FFD700 !important; /* Borda dourada no destaque */
    }

    /* 🔥 IMAGEM DENTRO DO QUADRADO */
    .thumbnail img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 0 !important; /* Força a imagem a ser quadrada */
      display: block !important;
    }

    #btnVoltar {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1000;
      padding: 10px 25px;
      font-size: 1.2em;
      border-radius: 30px;
      border: none;
      background-color: #FFD700;
      color: #000;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    #btnVoltar:hover {
      background-color: #ffcc00;
    }

  </style>
</head>

<body class="fundo-azul">

  <div class="background"></div>

  <button id="btnVoltar" onclick="window.history.back()">🔙 Voltar</button>

  <div class="container">
    <div class="menu-container">
      <h2>Escolha uma letra para colorir:</h2>
      <div class="grid" id="gridLetras">
        <!-- JavaScript gera as miniaturas aqui -->
      </div>
    </div>
  </div>

  <script>
    const letras = [
      { nome: "Animal 1", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 2", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 3", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 4", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 5", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 6", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 7", url: "https://github.io", img: "https://postimg.cc" },
      { nome: "Animal 8", url: "https://github.io", img: "https://postimg.cc" }
    ];

    const grid = document.getElementById("gridLetras");

    letras.forEach(l => {
      const div = document.createElement("div");
      div.className = "thumbnail";
      div.innerHTML = `<img src="${l.img}" alt="${l.nome}">`;
      div.onclick = () => window.location.href = l.url;
      grid.appendChild(div);
    });
  </script>

</body>
</html>
